# ORBIT CI — checklist docs/08 Engineering: "CI build and lint".
# Web (lint + typecheck + test e2e + build) dan mobile (typecheck).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      AI_PROVIDER: local # CI tanpa jaringan AI — jangkar lokal deterministik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - name: e2e PostgreSQL (pglite embedded)
        run: npm test
        env:
          ORBIT_DB: pglite
          AI_PROVIDER: local
      - run: npm run build

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
